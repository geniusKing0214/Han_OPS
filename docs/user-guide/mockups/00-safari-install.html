<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../mockup.css" />
  <title>00 Safari 바로가기</title>
</head>
<body>
  <div class="phone" id="screen" style="min-height:860px">
    <div class="status-bar">12:00</div>
    <div style="background:#1c1c1e;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333">
      <span style="font-size:12px;color:#8e8e93">완료</span>
      <span style="font-size:13px;font-weight:600;color:#fff">Safari</span>
      <span style="font-size:20px" class="highlight">⬆️</span>
    </div>
    <div style="height:280px;background:var(--bg);opacity:.6;display:flex;align-items:center;justify-content:center">
      <span style="font-size:20px;font-weight:700">HAN <span style="color:var(--accent)">OPS</span></span>
    </div>
    <!-- iOS 공유 시트 -->
    <div style="background:#2c2c2e;border-radius:16px 16px 0 0;padding:16px;margin-top:-20px;position:relative;z-index:2">
      <div style="width:36px;height:4px;background:#636366;border-radius:2px;margin:0 auto 16px"></div>
      <div style="font-size:15px;font-weight:600;color:#fff;margin-bottom:14px;text-align:center">공유</div>
      <div style="display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;border-bottom:1px solid #444;margin-bottom:12px">
        <div style="text-align:center;min-width:64px">
          <div style="width:52px;height:52px;background:#3a3a3c;border-radius:12px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:22px">💬</div>
          <div style="font-size:10px;color:#aeaeb2">메시지</div>
        </div>
        <div style="text-align:center;min-width:64px" class="highlight">
          <div style="width:52px;height:52px;background:var(--accent);border-radius:12px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:22px;outline:3px solid #fff">➕</div>
          <div style="font-size:11px;color:var(--accent);font-weight:700">홈 화면에 추가</div>
        </div>
        <div style="text-align:center;min-width:64px">
          <div style="width:52px;height:52px;background:#3a3a3c;border-radius:12px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:22px">📋</div>
          <div style="font-size:10px;color:#aeaeb2">복사</div>
        </div>
      </div>
      <div style="background:#3a3a3c;border-radius:12px;padding:14px;margin-top:8px" class="highlight">
        <div style="font-size:13px;font-weight:600;color:#fff;margin-bottom:4px">2단계: 이름 확인 후 «추가»</div>
        <div style="display:flex;align-items:center;gap:12px;margin-top:10px">
          <div style="width:48px;height:48px;background:var(--bg);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">HAN<br/>OPS</div>
          <div style="flex:1">
            <div style="font-size:14px;font-weight:600;color:#fff">HAN OPS</div>
            <div style="font-size:11px;color:#8e8e93">geniusking0214.github.io</div>
          </div>
          <div style="background:var(--accent);color:var(--accent-fg);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700">추가</div>
        </div>
      </div>
      <div style="margin-top:14px;font-size:12px;color:#8e8e93;text-align:center;line-height:1.6">
        ① 하단 <strong style="color:#fff">공유(⬆️)</strong> 버튼 탭<br/>
        ② <strong style="color:var(--accent)">홈 화면에 추가</strong> 선택<br/>
        ③ «추가» 누르면 홈 화면에 아이콘 생성
      </div>
    </div>
  </div>
</body>
</html>
