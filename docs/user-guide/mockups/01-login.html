<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../mockup.css" />
  <title>01 로그인</title>
</head>
<body>
  <div class="phone" id="screen">
    <div class="status-bar">12:00</div>
    <div class="content center-wrap" style="min-height:700px">
      <div class="h1" style="font-size:28px;margin-bottom:8px">HAN <span style="color:var(--accent)">OPS</span></div>
      <p class="sub" style="margin-bottom:24px">Google 계정으로 로그인합니다.</p>
      <div class="card highlight" style="width:100%;max-width:340px">
        <div class="card-title">로그인</div>
        <div class="card-desc">Google 계정으로 로그인합니다. 신규 사용자는 관리자 승인 후 이용할 수 있습니다.</div>
        <div class="btn">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/></svg>
          Google로 계속하기
        </div>
      </div>
    </div>
  </div>

</html>
