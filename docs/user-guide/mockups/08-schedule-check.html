<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../mockup.css" />
  <title>08 스케줄 확인</title>
</head>
<body>
  <div class="phone" id="screen">
    <div class="status-bar">12:00</div>
    <div class="top-bar">
      <div class="logo">HAN <span>OPS</span></div>
      <div class="bell">🔔</div>
    </div>
    <div class="content">
      <div class="h1">Schedule</div>
      <p class="sub">내가 신청·승인된 일정을 달력에서 확인합니다.</p>
      <div class="cal highlight" style="margin-bottom:14px">
        <div class="cal-head">2026년 7월</div>
        <div class="cal-grid">
          <div class="cal-dow">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div><div class="cal-dow">수</div><div class="cal-dow">목</div><div class="cal-dow">금</div><div class="cal-dow">토</div>
          <div class="cal-day"></div><div class="cal-day"></div><div class="cal-day">1</div><div class="cal-day">2</div><div class="cal-day">3</div><div class="cal-day">4</div><div class="cal-day">5</div>
          <div class="cal-day">6</div><div class="cal-day">7</div><div class="cal-day">8</div><div class="cal-day">9</div><div class="cal-day">10</div><div class="cal-day">11</div><div class="cal-day">12</div>
          <div class="cal-day">13</div><div class="cal-day">14</div><div class="cal-day">15</div><div class="cal-day">16</div><div class="cal-day">17</div><div class="cal-day">18</div><div class="cal-day">19</div>
          <div class="cal-day sel dot">20</div><div class="cal-day">21</div><div class="cal-day">22</div><div class="cal-day">23</div><div class="cal-day">24</div><div class="cal-day">25</div><div class="cal-day">26</div>
        </div>
        <div style="font-size:10px;color:var(--muted-fg);text-align:center;margin-top:8px">● = 일정 있는 날 · 금색 = 선택한 날</div>
      </div>
      <div class="card highlight">
        <div class="card-title">7월 20일 · 내 일정</div>
        <div style="margin-top:10px;padding:12px;background:var(--muted);border-radius:8px;border-left:3px solid var(--accent)">
          <div style="font-weight:600;font-size:14px">7월 토너먼트</div>
          <div style="font-size:12px;color:var(--muted-fg);margin-top:4px">코엑스 · 14:00</div>
          <span class="badge badge-ok" style="margin-top:8px">승인 완료</span>
        </div>
      </div>
      <div style="margin-top:12px;font-size:12px;color:var(--muted-fg);line-height:1.6;padding:12px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border)">
        💡 <strong style="color:var(--fg)">Dashboard</strong>에서도 오늘 일정을 한눈에 볼 수 있습니다.<br/>
        하단 <strong style="color:var(--fg)">홈</strong> 탭 → 오늘 근무 카드 확인
      </div>
    </div>
    <div class="bottom-nav">
      <div class="nav-item"><span class="nav-icon">🏠</span>홈</div>
      <div class="nav-item on"><span class="nav-icon">📅</span>일정</div>
      <div class="nav-item"><span class="nav-icon">📋</span>신청</div>
      <div class="nav-item"><span class="nav-icon">📢</span>공지</div>
      <div class="nav-item"><span class="nav-icon">⋯</span>더보기</div>
    </div>
  </div>
</body>
</html>
