<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../mockup.css" />
  <title>05 슬롯 신청</title>
</head>
<body>
  <div class="phone" id="screen" style="min-height:844px">
    <div class="status-bar">12:00</div>
    <div class="top-bar" style="opacity:.5">
      <div class="logo">HAN <span>OPS</span></div>
      <div class="bell">🔔</div>
    </div>
    <div class="content" style="opacity:.4">
      <div class="h1">Schedule</div>
      <div class="cal" style="height:200px"></div>
    </div>
    <div class="sheet highlight">
      <div class="sheet-title">슬롯 신청</div>
      <div class="sheet-desc">제출 시 내 신청 목록(Applications)에 표시됩니다.</div>
      <div style="font-size:13px;line-height:1.6;margin-bottom:12px">
        <strong>7월 토너먼트</strong> · 코엑스<br/>
        <span style="color:var(--muted-fg)">2026-07-20 · 14:00 시작</span><br/>
        <span style="color:var(--muted-fg)">정원 3/5 (잔여 2)</span>
      </div>
      <label style="font-size:11px;color:var(--muted-fg)">메모 (선택)</label>
      <textarea placeholder="운영팀 전달 사항">첫 참가입니다.</textarea>
      <div class="sheet-btns">
        <div class="btn btn-outline">취소</div>
        <div class="btn btn-accent highlight">신청하기</div>
      </div>
    </div>
    <div class="bottom-nav" style="opacity:.5">
      <div class="nav-item"><span class="nav-icon">🏠</span>홈</div>
      <div class="nav-item on"><span class="nav-icon">📅</span>일정</div>
      <div class="nav-item"><span class="nav-icon">📋</span>신청</div>
      <div class="nav-item"><span class="nav-icon">📢</span>공지</div>
      <div class="nav-item"><span class="nav-icon">⋯</span>더보기</div>
    </div>
  </div>
</body>
</html>
