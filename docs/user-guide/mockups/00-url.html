<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../mockup.css" />
  <title>00 접속 주소</title>
</head>
<body>
  <div class="phone" id="screen" style="min-height:820px">
    <div class="status-bar">12:00</div>
    <!-- Safari 스타일 주소창 -->
    <div style="background:#1c1c1e;padding:10px 12px;border-bottom:1px solid #333">
      <div style="background:#2c2c2e;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px" class="highlight">
        <span style="font-size:14px">🔒</span>
        <span style="font-size:13px;color:#8e8e93;flex:1;word-break:break-all">geniusking0214.github.io/Han_OPS/</span>
      </div>
      <div style="text-align:center;font-size:11px;color:#636366;margin-top:8px">Safari · Chrome 주소창에 위 주소 입력</div>
    </div>
    <div class="content center-wrap" style="min-height:520px;padding-top:40px">
      <div class="h1" style="font-size:32px;margin-bottom:8px">HAN <span style="color:var(--accent)">OPS</span></div>
      <p class="sub" style="font-size:15px;margin-bottom:20px">Google 계정으로 로그인합니다.</p>
      <div class="card" style="width:100%;max-width:340px">
        <div class="btn" style="font-size:15px;height:48px">Google로 계속하기</div>
      </div>
      <div style="margin-top:24px;padding:16px;background:rgba(200,169,107,.12);border:2px dashed var(--accent);border-radius:12px;width:100%;max-width:340px;text-align:left">
        <div style="font-size:14px;font-weight:700;color:var(--accent);margin-bottom:8px">📌 접속 주소 (북마크 권장)</div>
        <div style="font-size:13px;line-height:1.6;color:var(--fg)">https://geniusking0214.github.io/Han_OPS/</div>
        <div style="font-size:12px;color:var(--muted-fg);margin-top:8px">※ /Han_OPS/ 까지 포함해야 합니다</div>
      </div>
    </div>
  </div>
</body>
</html>
