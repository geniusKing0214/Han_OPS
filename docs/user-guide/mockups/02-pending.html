<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../mockup.css" />
  <title>02 승인 대기</title>
</head>
<body>
  <div class="phone" id="screen">
    <div class="status-bar">12:00</div>
    <div class="content center-wrap">
      <div class="wait-icon">⏳</div>
      <div class="wait-title">가입 승인 대기 중</div>
      <p class="wait-desc">관리자가 승인하면<br/>앱을 이용할 수 있습니다.<br/><br/>승인 전까지는<br/>일정 신청이 불가합니다.</p>
      <div class="card" style="width:100%;margin-top:20px;text-align:left">
        <div style="font-size:12px;color:var(--muted-fg)">로그인 계정</div>
        <div style="font-size:14px;margin-top:4px">user@gmail.com</div>
      </div>
    </div>
  </div>
</body>
</html>
