<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../mockup.css" />
  <title>00 Chrome 바로가기</title>
</head>
<body>
  <div class="phone" id="screen" style="min-height:860px">
    <div class="status-bar" style="background:#1a1a1a">12:00</div>
    <div style="background:#1a1a1a;padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #333">
      <div style="flex:1;background:#303030;border-radius:20px;padding:8px 14px;font-size:12px;color:#9aa0a6;display:flex;align-items:center;gap:6px" class="highlight">
        <span>🔒</span>
        <span style="color:#e8eaed;flex:1">geniusking0214.github.io/Han_OPS/</span>
      </div>
      <div style="font-size:22px;color:#e8eaed" class="highlight">⋮</div>
    </div>
    <div style="height:240px;background:var(--bg);opacity:.5;display:flex;align-items:center;justify-content:center">
      <span style="font-size:20px;font-weight:700">HAN <span style="color:var(--accent)">OPS</span></span>
    </div>
    <!-- Chrome 메뉴 -->
    <div style="position:absolute;top:88px;right:12px;width:220px;background:#303030;border-radius:12px;padding:8px 0;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:10;border:2px solid var(--accent)">
      <div style="padding:12px 16px;font-size:14px;color:#e8eaed;border-bottom:1px solid #444">새 탭</div>
      <div style="padding:12px 16px;font-size:14px;color:#e8eaed;border-bottom:1px solid #444">즐겨찾기</div>
      <div style="padding:12px 16px;font-size:14px;color:#e8eaed;background:rgba(200,169,107,.2);font-weight:700" class="highlight">📲 홈 화면에 추가</div>
      <div style="padding:12px 16px;font-size:14px;color:#e8eaed">데스크톱 사이트</div>
    </div>
    <div style="padding:16px;margin-top:180px">
      <div style="background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:16px" class="highlight">
        <div style="font-size:15px;font-weight:700;color:var(--accent);margin-bottom:10px">홈 화면에 추가 확인</div>
        <div style="display:flex;align-items:center;gap:14px">
          <div style="width:56px;height:56px;background:var(--bg);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;text-align:center;line-height:1.2">HAN<br/>OPS</div>
          <div style="flex:1">
            <div style="font-size:16px;font-weight:600">HAN OPS</div>
            <div style="font-size:12px;color:var(--muted-fg);margin-top:2px">geniusking0214.github.io</div>
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:16px">
          <div style="flex:1;text-align:center;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--muted-fg)">취소</div>
          <div style="flex:1;text-align:center;padding:12px;background:var(--accent);color:var(--accent-fg);border-radius:8px;font-size:14px;font-weight:700">추가</div>
        </div>
      </div>
      <div style="margin-top:20px;font-size:13px;color:var(--muted-fg);line-height:1.8;padding:14px;background:var(--card);border-radius:12px;border:1px solid var(--border)">
        <strong style="color:var(--fg);font-size:14px">Chrome (Android) 방법</strong><br/><br/>
        ① 주소창 옆 <strong style="color:var(--accent)">⋮</strong> (더보기) 탭<br/>
        ② <strong style="color:var(--accent)">홈 화면에 추가</strong> 선택<br/>
        ③ «추가» 누르면 홈 화면 아이콘 생성<br/><br/>
        <span style="font-size:12px">※ «앱 설치»가 보이면 그것을 선택해도 됩니다</span>
      </div>
    </div>
  </div>
</body>
</html>
