# Settings → Pages → Source: GitHub Actions (브랜치 배포는 끄세요)
# Firebase: Settings → Secrets and variables → Actions → Variables (또는 Environment github-pages)

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # deploy-pages 등 일부 Actions의 Node 20 deprecation 경고 제거
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      STATIC_EXPORT: "1"
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve Firebase env (secrets or variables)
        env:
          K_API: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          K_AUTH: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          K_PID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          K_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          K_SENDER: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          K_APP: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          V_API: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          V_AUTH: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          V_PID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          V_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          V_SENDER: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          V_APP: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          K_GCID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          V_GCID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          K_VAPID: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          V_VAPID: ${{ vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          K_RELAY: ${{ secrets.NEXT_PUBLIC_PUSH_RELAY_URL }}
          V_RELAY: ${{ vars.NEXT_PUBLIC_PUSH_RELAY_URL }}
          K_PUSH_SECRET: ${{ secrets.NEXT_PUBLIC_PUSH_API_SECRET }}
          V_PUSH_SECRET: ${{ vars.NEXT_PUBLIC_PUSH_API_SECRET }}
        run: |
          pick() { [ -n "$1" ] && echo "$1" || echo "$2"; }
          {
            echo "NEXT_PUBLIC_FIREBASE_API_KEY=$(pick "$K_API" "$V_API")"
            echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$(pick "$K_AUTH" "$V_AUTH")"
            echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$(pick "$K_PID" "$V_PID")"
            echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$(pick "$K_BUCKET" "$V_BUCKET")"
            echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$(pick "$K_SENDER" "$V_SENDER")"
            echo "NEXT_PUBLIC_FIREBASE_APP_ID=$(pick "$K_APP" "$V_APP")"
            gcid="$(pick "$K_GCID" "$V_GCID")"
            if [ -n "$gcid" ]; then
              echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=$gcid"
            fi
            vapid="$(pick "$K_VAPID" "$V_VAPID")"
            if [ -n "$vapid" ]; then
              echo "NEXT_PUBLIC_FIREBASE_VAPID_KEY=$vapid"
            fi
            relay="$(pick "$K_RELAY" "$V_RELAY")"
            if [ -n "$relay" ]; then
              echo "NEXT_PUBLIC_PUSH_RELAY_URL=$relay"
            fi
            push_secret="$(pick "$K_PUSH_SECRET" "$V_PUSH_SECRET")"
            if [ -n "$push_secret" ]; then
              echo "NEXT_PUBLIC_PUSH_API_SECRET=$push_secret"
            fi
          } >> "$GITHUB_ENV"

      - name: Validate Firebase env vars
        run: |
          missing=""
          for key in \
            NEXT_PUBLIC_FIREBASE_API_KEY \
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            NEXT_PUBLIC_FIREBASE_PROJECT_ID \
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            NEXT_PUBLIC_FIREBASE_APP_ID
          do
            val="$(printenv "$key" || true)"
            if [ -z "$val" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing env vars:$missing"
            echo "Add them under Repository OR Environment (github-pages) → Actions variables/secrets."
            exit 1
          fi
          vapid="${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}"
          if [ -n "$vapid" ]; then
            vapid_len="${#vapid}"
            echo "VAPID key length: ${vapid_len} chars"
            if [ "$vapid_len" -lt 87 ]; then
              echo "VAPID key too short (${vapid_len} chars). Firebase에서 키 전체를 복사하세요."
              exit 1
            fi
          fi

      - name: Install and build
        run: |
          npm ci
          npm run build
          touch out/.nojekyll
          if [ ! -f out/index.html ]; then
            echo "Build did not produce out/index.html"
            ls -la out || true
            exit 1
          fi
          echo "Build OK — pages:"
          ls out | head -20

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
